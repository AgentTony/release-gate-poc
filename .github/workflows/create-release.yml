name: Create release branch

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "New branch name, e.g. release/2.0"
        required: true
        type: string

      source_branch:
        description: "Create the release branch from"
        required: true
        type: choice
        options:
          - develop
          - main
        default: develop

permissions:
  contents: read

concurrency:
  group: release-branch-creation
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Authenticate as release App
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check releases and create branch
        uses: actions/github-script@v7
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const name = process.env.RELEASE_NAME;
            const sourceName = process.env.SOURCE_BRANCH;

            if (!/^release\/[A-Za-z0-9][A-Za-z0-9_-]*(?:\.[A-Za-z0-9_-]+)*$/.test(name)) {
              throw new Error("Use a name such as release/2.0.");
            }

            // Validate API requests as well as selections made in the UI.
            if (!["develop", "main"].includes(sourceName)) {
              throw new Error("Source branch must be develop or main.");
            }

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            if (branches.some(branch => branch.name === name)) {
              throw new Error(`Branch ${name} already exists.`);
            }

            const main = branches.find(branch => branch.name === "main");
            const develop = branches.find(branch => branch.name === "develop");

            if (!main || !develop) {
              throw new Error("Both main and develop must exist.");
            }

            const source = branches.find(
              branch => branch.name === sourceName
            );

            const releases = branches.filter(
              branch => branch.name.startsWith("release/")
            );

            if (releases.length === 0) {
              throw new Error(
                "No existing release branch found. Check the release history."
              );
            }

            const pending = [];

            for (const release of releases) {
              for (const target of [main, develop]) {
                const { data } =
                  await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${release.commit.sha}...${target.commit.sha}`,
                    per_page: 1
                  });

                if (data.merge_base_commit.sha !== release.commit.sha) {
                  pending.push(
                    `${release.name} is not fully included in ${target.name}`
                  );
                }
              }
            }

            if (pending.length > 0) {
              for (const message of pending) {
                core.error(message);
              }

              throw new Error(
                "Release creation blocked: merge the pending release changes first."
              );
            }

            // Stop if a checked branch changed during verification.
            for (const branch of [main, develop, ...releases]) {
              const { data } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: branch.name
              });

              if (data.commit.sha !== branch.commit.sha) {
                throw new Error(
                  `${branch.name} changed during checks. Run the workflow again.`
                );
              }
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${name}`,
              sha: source.commit.sha
            });

            await core.summary
              .addHeading("Release branch created")
              .addTable([
                ["Setting", "Value"],
                ["New branch", name],
                ["Source branch", sourceName],
                ["Source commit", source.commit.sha]
              ])
              .write();
